name: Release

on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write

jobs:
  # Opens / updates the "version packages" PR when changesets are present.
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create or update version PR
        uses: changesets/action@v1
        with:
          version: pnpm run version
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Tags + creates a GitHub Release as x.x.x (no npm publish — distribution is the
  # plugin marketplace) once package.json holds a version that has not been tagged yet.
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag + GitHub Release if version is new
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          if find .changeset -name '*.md' ! -name 'README.md' | grep -q .; then
            echo "Unconsumed changesets present — version PR pending. Skipping release."
            exit 0
          fi
          if git rev-parse -q --verify "refs/tags/${VERSION}" >/dev/null; then
            echo "Tag ${VERSION} already exists. Nothing to release."
            exit 0
          fi
          git tag "${VERSION}"
          git push origin "${VERSION}"
          gh release create "${VERSION}" --title "${VERSION}" --notes "See CHANGELOG.md for details."
