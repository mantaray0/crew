name: Release

on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  statuses: write

jobs:
  # Opens / updates the "version packages" PR when changesets are present.
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create or update version PR
        uses: changesets/action@v1
        with:
          version: pnpm run version
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The version PR is authored by GITHUB_TOKEN, so GitHub will not auto-run CI on
      # it and the required `validate` check would never report — blocking the merge.
      # Provide it from this (non-suppressed) workflow: check out the version branch,
      # run the same validator ci.yml runs, and post a matching commit status so the
      # PR can merge without an admin override. SHA comes from git, not from PR text.
      - name: Provide `validate` status for the version PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          SHA="$(git ls-remote origin refs/heads/changeset-release/main | cut -f1 || true)"
          if [ -z "${SHA:-}" ]; then
            echo "No version PR branch open — nothing to validate."
            exit 0
          fi
          git fetch --depth=1 origin changeset-release/main
          git checkout -q "${SHA}"
          if node scripts/validate-plugin.mjs; then STATE=success; else STATE=failure; fi
          gh api "repos/${REPO}/statuses/${SHA}" \
            -f state="${STATE}" \
            -f context=validate \
            -f description="plugin structure (version PR, auto)" >/dev/null
          echo "Posted validate=${STATE} for ${SHA}"

  # Tags + creates a GitHub Release as x.x.x (no npm publish — distribution is the
  # plugin marketplace) once package.json holds a version that has not been tagged yet.
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag + GitHub Release if version is new
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          if find .changeset -name '*.md' ! -name 'README.md' | grep -q .; then
            echo "Unconsumed changesets present — version PR pending. Skipping release."
            exit 0
          fi
          if git rev-parse -q --verify "refs/tags/${VERSION}" >/dev/null; then
            echo "Tag ${VERSION} already exists. Nothing to release."
            exit 0
          fi
          git tag "${VERSION}"
          git push origin "${VERSION}"
          gh release create "${VERSION}" --title "${VERSION}" --notes "See CHANGELOG.md for details."
