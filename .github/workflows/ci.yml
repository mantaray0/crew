name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    # Skip on the changesets "version packages" PR: it is authored by GITHUB_TOKEN,
    # so GitHub won't auto-run CI on it. Its `validate` status is provided instead by
    # the release workflow (see release.yml) so the PR can merge without an override.
    if: github.head_ref != 'changeset-release/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          # setup-node@v5 enables package-manager caching by default when a
          # packageManager field is present (pnpm@…). This job installs no deps
          # (it only runs a standalone script), and pnpm is not set up here — so
          # auto-caching would fail looking for pnpm. Disable it.
          package-manager-cache: false
      - name: Validate plugin structure
        run: node scripts/validate-plugin.mjs
